<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="Secalyzer — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">Secalyzer — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#0ea5e9">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 1.94s steps(43) 0.60s forwards" fill="#e5e7eb">composer global require secalyzer/secalyzer</text>
<text x="50" y="100" class="l" style="animation:show .01s 2.84s forwards" fill="#94a3b8">✅ Installed secalyzer 1.0.0</text>
<text x="50" y="126" class="l" style="animation:show .01s 3.06s forwards" fill="#94a3b8">secalyzer is now available globally</text>
<text x="28" y="178" class="l" style="animation:show .01s 3.63s forwards"><tspan fill="#0ea5e9">❯</tspan></text><text x="50" y="178" class="l ty" style="animation:show .01s 3.63s forwards,type 1.76s steps(39) 3.63s forwards" fill="#e5e7eb">secalyzer scan ./theme --format=console</text>
<text x="50" y="204" class="l" style="animation:show .01s 5.69s forwards" fill="#94a3b8">Scanning 38 files... ✓</text>
<text x="50" y="230" class="l" style="animation:show .01s 5.91s forwards" fill="#94a3b8">HIGH  templates/render.php:27   Reflected XSS via unsanitized $_GET</text>
<text x="50" y="256" class="l" style="animation:show .01s 6.13s forwards" fill="#94a3b8">MED   lib/update.php:112       Missing signature verification on update</text>
<text x="50" y="282" class="l" style="animation:show .01s 6.35s forwards" fill="#94a3b8">3 issues found (1 high, 2 medium)</text>
<text x="28" y="334" class="l" style="animation:show .01s 6.92s forwards"><tspan fill="#0ea5e9">❯</tspan></text><text x="50" y="334" class="l ty" style="animation:show .01s 6.92s forwards,type 1.94s steps(43) 6.92s forwards" fill="#e5e7eb">secalyzer scan ./theme --ai --ai-key=sk-...</text>
<text x="50" y="360" class="l" style="animation:show .01s 9.16s forwards" fill="#94a3b8">Static scan complete</text>
<text x="50" y="386" class="l" style="animation:show .01s 9.38s forwards" fill="#94a3b8">AI analyzing 4 high-risk snippets...</text>
<text x="50" y="412" class="l" style="animation:show .01s 9.60s forwards" fill="#94a3b8">LLM confirms high severity XSS; suggests htmlspecialchars + CSP</text>
<text x="50" y="438" class="l" style="animation:show .01s 9.82s forwards" fill="#94a3b8">Report written to ./secalyzer-report.html</text>
<text x="28" y="490" class="l" style="animation:show .01s 10.39s forwards"><tspan fill="#0ea5e9">❯</tspan></text><text x="50" y="490" class="l ty" style="animation:show .01s 10.39s forwards,type 1.26s steps(28) 10.39s forwards" fill="#e5e7eb">secalyzer scan ./theme --fix</text>
<text x="50" y="516" class="l" style="animation:show .01s 11.95s forwards" fill="#94a3b8">Generated patch for XSS in render.php</text>
<g class="l" style="animation:show .01s 12.17s forwards"><text x="28" y="542" fill="#0ea5e9">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
